Setting up a workflow file through the editor
Aapke screenshot mein Get started with GitHub Actions page dikh raha hai. Iska matlab hai ki workflow file abhi repository mein hai hi nahi. Isliye “Build exe and apk” nahi dikh raha. Use yahin se bana lete hain:

Is page par “Skip this and set up a workflow yourself →” likha hai (Search workflows box ke upar, neeli link). Us par click karein.
Ek editor khulega, jisme upar khataa / .github / workflows / main.yml likha hoga. Neeche box mein jo bhi pehle se likha hai, sab select karke delete kar dein (Ctrl+A, phir Delete).
Ye poora content paste karein:
yaml
name: Build exe and apk
on:
  push:
  workflow_dispatch:
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Khata-Windows-exe
          path: |
            dist/*.exe
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Khata-Android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
Upar file ke naam main.yml ko badal kar build.yml kar sakte hain. Ye zaroori nahi hai, main.yml rehne par bhi chalega.
Upar right mein hara Commit changes... button dabayein, phir popup mein dobara Commit changes.
Phir Actions tab mein jaayein. Left side mein Build exe and apk dikhega, aur build apne aap shuru ho jayega (peela chakra). Chakra hare tick mein badal jaye, tab us par click karke neeche Artifacts se .exe aur .apk download karein.
Build chalne ke liye repository mein package.json, main.js, capacitor.config.json aur www/index.html bhi hone chahiye. Commit karne se pehle Code tab mein ek baar check kar lein ki ye files wahan hain. Ye na hon, to batayein, main bata dunga ki kaise upload karni hain.


